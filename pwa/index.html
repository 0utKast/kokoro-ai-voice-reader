<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kokoro AI Voice Reader</title>

  <!-- PWA Manifest & App Metas -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kokoro AI">
  
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="style.css">
  <script>
    // Remote mobile telemetry for instant diagnosis
    window.addEventListener('error', function(e) {
      try {
        fetch('/api/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'JS_ERROR', message: e.message, file: e.filename, line: e.lineno })
        }).catch(function(){});
      } catch(err){}
    });
    window.addEventListener('unhandledrejection', function(e) {
      try {
        fetch('/api/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'UNHANDLED_REJECTION', reason: String(e.reason) })
        }).catch(function(){});
      } catch(err){}
    });
  </script>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Kokoro AI</h1>
          <span class="brand-sub">Neural TTS Móvil</span>
        </div>
      </div>
      <div id="hardware-badge" class="badge">
        <span class="badge-dot"></span>
        <span id="hardware-text">Iniciando...</span>
      </div>
    </header>

    <!-- PWA Install Prompt Banner (Hidden by default) -->
    <div id="install-banner" class="install-banner hidden">
      <span>📲 Instala Kokoro AI en tu teléfono</span>
      <button id="btn-install-pwa" class="btn btn-secondary">Instalar</button>
    </div>

    <!-- Model Status / Download Progress -->
    <div id="model-progress-container" class="model-progress-card hidden">
      <div class="progress-header">
        <span id="model-status-text">Cargando modelo neuronal...</span>
        <span id="model-percent-text">0%</span>
      </div>
      <div class="progress-track">
        <div id="model-progress-bar" class="progress-fill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Quick Action Tools Bar -->
    <section class="tools-bar">
      <button id="btn-load-file" class="btn btn-secondary" title="Cargar archivo PDF, TXT o Markdown">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        PDF / TXT
      </button>
      <input type="file" id="file-input" accept=".pdf,.txt,.md" style="display: none;" />

      <button id="btn-paste-clip" class="btn btn-secondary" title="Pegar texto desde el portapapeles">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
        </svg>
        Pegar
      </button>

      <button id="btn-clear-text" class="btn btn-ghost" title="Limpiar texto">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Limpiar
      </button>

      <button id="btn-reset-app" class="btn btn-ghost" title="Reiniciar memoria y caché" style="color: #f87171;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6"></path>
          <path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Reiniciar
      </button>

      <button id="btn-download-mp3" class="btn btn-ghost" title="Descargar audio MP3 generado" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span id="btn-download-text">Descargar MP3</span>
      </button>
    </section>

    <!-- Reading / Text Area -->
    <main class="reading-area">
      <!-- Edit Mode Textarea -->
      <textarea id="text-input" class="text-editor" placeholder="Pega aquí cualquier artículo o libro, o compártelo desde Chrome, WhatsApp o Twitter..." rows="6"></textarea>

      <!-- Karaoke Surround Mode Display -->
      <div id="karaoke-display" class="karaoke-container hidden">
        <div id="karaoke-chunks" class="chunks-flow"></div>
      </div>
    </main>

    <!-- Fixed Bottom Controls Dock -->
    <div class="bottom-dock">
      <!-- Playback Status Bar -->
      <div id="playback-status-bar" class="status-bar hidden">
        <div class="status-info">
          <span id="current-chunk-badge" class="chunk-counter">🔊 Frase 1 de 1</span>
          <span id="conversion-status-badge" class="conversion-indicator">⚡ En espera</span>
        </div>
        <div class="conversion-progress-track">
          <div id="conversion-progress-fill" class="conversion-progress-bar" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Audio Player Controls -->
      <footer class="player-controls">
        <!-- Control Buttons -->
        <div class="primary-controls">
          <button id="btn-prev-chunk" class="btn-icon" title="Frase anterior">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="19 20 9 12 19 4 19 20"></polygon>
              <line x1="5" y1="19" x2="5" y2="5"></line>
            </svg>
          </button>

          <button id="btn-play-pause" class="btn-play" title="Reproducir">
            <svg id="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg id="icon-pause" class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          </button>

          <button id="btn-stop" class="btn-icon" title="Detener">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <rect x="5" y="5" width="14" height="14"></rect>
            </svg>
          </button>

          <button id="btn-next-chunk" class="btn-icon" title="Siguiente frase">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 4 15 12 5 20 5 4"></polygon>
              <line x1="19" y1="5" x2="19" y2="19"></line>
            </svg>
          </button>
        </div>

        <!-- Settings Row: Voice & Speed -->
        <div class="settings-grid">
          <div class="setting-item">
            <label for="voice-select">Voz Neuronal</label>
            <select id="voice-select" class="form-select"></select>
          </div>

          <div class="setting-item speed-item">
            <div class="setting-label-row">
              <label for="speed-slider">Velocidad</label>
              <span id="speed-value">1.0x</span>
            </div>
            <input type="range" id="speed-slider" min="0.75" max="1.75" step="0.05" value="1.0" class="form-range">
          </div>
        </div>
      </footer>
    </div>
  </div>

  <script src="../src/libs/lame.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
